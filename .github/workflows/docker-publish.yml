name: Release and publish Docker image to GHCR

on:
  workflow_dispatch:
    inputs:
      confirm_current_version:
        description: "Release the version already committed in package.json on main. Update and commit it before running."
        required: true
        type: boolean
        default: false

concurrency:
  group: offline-enrichment-release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the SBOM release commit and tag
    outputs:
      version: ${{ steps.publish.outputs.version }}
      commit: ${{ steps.publish.outputs.commit }}
      short_commit: ${{ steps.publish.outputs.short_commit }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # Kept: the "Commit SBOM and create release tag" step pushes the
          # release commit and tag with these credentials.
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Check release version
        id: version
        env:
          CONFIRM_CURRENT_VERSION: ${{ inputs.confirm_current_version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run this release workflow from main." >&2
            exit 1
          fi
          if [[ "$CONFIRM_CURRENT_VERSION" != "true" ]]; then
            echo "Confirm that the committed package.json version is the intended release." >&2
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "package.json version is not a valid release tag: $version" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$version"; then
            echo "Release tag $version already exists. Commit a new package.json version first." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate current SBOM
        run: |
          pnpm install --frozen-lockfile
          pnpm run sbom

      - name: Save release SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-enrichment-sbom
          path: |
            SBOM.cdx.json
            SBOM.csv

      - name: Commit SBOM and create release tag
        id: publish
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- SBOM.cdx.json SBOM.csv
          git commit --allow-empty -m "chore: release $RELEASE_VERSION"
          git tag "$RELEASE_VERSION"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$RELEASE_VERSION"
          release_commit="$(git rev-parse HEAD)"
          {
            echo "version=$RELEASE_VERSION"
            echo "commit=$release_commit"
            echo "short_commit=${release_commit:0:7}"
          } >> "$GITHUB_OUTPUT"

  docker:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GHCR

    steps:
      - name: Checkout release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release.outputs.commit }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          pull: true
          push: true
          sbom: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.release.outputs.version }}
            ${{ steps.image.outputs.name }}:sha-${{ needs.release.outputs.short_commit }}
          labels: |
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ needs.release.outputs.commit }}
